<div id="show-body" class="px-[30px] pb-[34px] pt-[26px]">

  {% include "tracking/partials/_season_accordion.html" %}

  <div class="k-section mt-7 mb-3 flex items-baseline justify-between">
    <h2 class="text-[20px] font-bold tracking-[-0.025em] text-ink">Your history with this show</h2>
  </div>

  {% for w in recent_watches %}
    <div class="flex items-center gap-3.5 border-b border-line py-2.5">
      <span class="w-[62px] shrink-0 k-code">{{ w.episode.code }}</span>
      <span class="min-w-0 flex-1 truncate text-[14px] font-medium text-ink">{{ w.episode.title|default:"(untitled)" }}</span>
      <span class="shrink-0 font-mono text-[12px] text-dim">
        {{ w.watched_at_label }}{% if w.score %} · {{ w.score }}/10{% endif %}
      </span>
    </div>
  {% empty %}
    <p class="py-3 text-[13px] text-dim">Nothing watched yet.</p>
  {% endfor %}
</div>
