<section id="books-table" class="px-[30px] pb-[30px]">
  {% if books %}
    <div class="overflow-x-auto rounded-[10px] border border-line bg-surface">
      <table class="w-full border-collapse text-left">
        <thead>
          <tr class="border-b border-line">
            <th class="k-col px-4 py-3">Book</th>
            <th class="k-col px-3 py-3">Status</th>
            <th class="k-col px-3 py-3">Progress</th>
            <th class="k-col px-3 py-3">Score</th>
            <th class="k-col px-3 py-3">Date</th>
            <th class="k-col px-4 py-3 text-right">Actions</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-line">
          {% for b in books %}
            {% include "tracking/books/_book_row.html" %}
          {% endfor %}
        </tbody>
      </table>
    </div>
  {% else %}
    <div class="rounded-[10px] border border-line bg-surface px-5 py-16 text-center">
      <p class="text-[14px] font-semibold text-ink">No books here</p>
      <p class="mt-1 text-[12px] text-muted">Choose another filter or add a book.</p>
    </div>
  {% endif %}
</section>
